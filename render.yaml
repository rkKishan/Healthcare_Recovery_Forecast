# Render Blueprint.
#
# Deploy with New > Blueprint rather than New > Web Service: Render reads
# every setting below, so the only thing left to fill in by hand is the
# handful of secrets marked `sync: false`.
#
# The free instance is 512 MB and 0.1 CPU. A single explained prediction
# leaves the process around 470 MB resident, so the settings here are chosen
# to stay under that rather than for speed.

services:
  - type: web
    name: healthcare-recovery-forecast
    runtime: docker
    plan: free
    # Closest region to India of the five Render offers.
    region: singapore
    branch: main
    # Neither dockerfilePath nor dockerContext is set. Render already
    # defaults to ./Dockerfile at the repo root, which is exactly where this
    # one lives, and stating them explicitly produced a build whose context
    # resolved to the Dockerfile itself:
    #   invalid local: stat /opt/render/project/src/Dockerfile: not a directory

    # Render restarts the instance if this stops returning 200, which is what
    # catches a container whose model failed to load.
    healthCheckPath: /api/health

    envVars:
      # Render generates this itself, so no placeholder ever reaches
      # production -- the app refuses to boot on one when FLASK_DEBUG is off.
      - key: SECRET_KEY
        generateValue: true

      # Prompted once, at blueprint creation. Neon connection string, with
      # the driver named: postgresql+psycopg://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Comma-separated addresses that get the admin role. This is the only
      # way to become an administrator -- nothing in a request can grant it.
      - key: ADMIN_EMAILS
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: FLASK_DEBUG
        value: "false"

      # Three demo accounts share one published password. Fine on a laptop,
      # not on a public URL.
      - key: SEED_DEMO_USERS
        value: "false"

      # Building the SHAP explainer at startup costs ~190 MB and several
      # seconds on 0.1 CPU. Deferring it until something actually asks for an
      # explanation keeps boot near 280 MB, which is the difference between
      # surviving a health check and being OOM-killed during one.
      - key: WARM_EXPLAINER
        value: "false"

      # Same origin serves the API and the SPA, so this only matters if the
      # frontend is ever hosted separately. Set to the service's own URL.
      - key: CORS_ORIGINS
        sync: false
