services:
  api:
    build: .
    ports:
      - "2800:2800"
    environment:
      # Swap to MySQL by uncommenting the DATABASE_URL below and the
      # depends_on block; SQLite is the zero-setup default.
      # DATABASE_URL: mysql+pymysql://forecast:forecast@db:3306/healthcare_forecast
      # No fallback on purpose: the app runs with FLASK_DEBUG=false here and
      # refuses to boot on a placeholder key, so compose should fail first
      # with a message you can act on.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, e.g. export SECRET_KEY=$(python -c "import secrets;print(secrets.token_hex(32))")}
      CORS_ORIGINS: http://localhost:9000,http://localhost:8080
      # Google Sign-In. Blank (the default) hides the button and leaves
      # password login as the only route in; no client secret is involved.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      TOTAL_BEDS: 0
      FLASK_DEBUG: "false"
    volumes:
      - uploads:/app/data
    # depends_on:
    #   db:
    #     condition: service_healthy

  db:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: healthcare_forecast
      MYSQL_USER: forecast
      MYSQL_PASSWORD: forecast
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uploads:
  mysql:
